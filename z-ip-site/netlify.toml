# Netlify 設定（第1候補ホスティング）。
# GitHub リポジトリを Netlify に接続すればこの設定で自動ビルド・公開される。
# コンタクトフォームは Netlify Forms（data-netlify="true"）で自動検知される。

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# 末尾スラッシュ運用（astro.config.mjs の trailingSlash: 'always' と揃える）
[[redirects]]
  from = "/en"
  to = "/en/"
  status = 301

[[redirects]]
  from = "/zh"
  to = "/zh/"
  status = 301
